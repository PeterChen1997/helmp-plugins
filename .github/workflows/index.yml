# main 有变化时重建 index.json；有变化才以 github-actions[bot] 身份提交，然后刷新 jsDelivr 缓存。
name: Build index

on:
  push:
    branches: [main]
    paths-ignore:
      - index.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.json
        run: python3 -I scripts/build-index.py

      - name: Commit index.json
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.json)" ]; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index.json [skip ci]"
          git push

      - name: Purge jsDelivr cache
        run: curl -fsS https://purge.jsdelivr.net/gh/PeterChen1997/helmp-plugins@main/index.json || true
